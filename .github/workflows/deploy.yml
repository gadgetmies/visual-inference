name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false
        env:
          CI: true
      - run: yarn build
        env:
          # Optional: set these as repository variables to open a sheet by default.
          REACT_APP_SHEET_ID: ${{ vars.SHEET_ID }}
          REACT_APP_NODES_TAB: ${{ vars.NODES_TAB }}
          REACT_APP_CONNECTIONS_TAB: ${{ vars.CONNECTIONS_TAB }}
          REACT_APP_SHEET_HAS_HEADER: ${{ vars.SHEET_HAS_HEADER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
